# Nginx reverse proxy snippet for GOWA v9.0.0
# Place inside the relevant server {} block on production
# Path: /etc/nginx/sites-available/lpmf (or similar)

location /gowa/ {
    # Strip /gowa prefix before proxying to GOWA
    rewrite ^/gowa/(.*)$ /$1 break;

    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;

    # v9 requires Upgrade for WebSocket (/ws)
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    # Disable buffering for real-time WebSocket
    proxy_buffering off;

    # Increase timeouts for long-poll / QR login
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
}
