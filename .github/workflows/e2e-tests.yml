name: E2E Tests (Laravel Dusk)

on:
  workflow_dispatch:

jobs:
  dusk-chrome:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: lis_db_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.3
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, pdo_pgsql, bcmath, soap, intl, gd, exif, iconv
          coverage: none

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Prepare environment
        run: |
          cp .env.testing.example .env.testing
          sed -i 's/^DB_DATABASE=.*/DB_DATABASE=lis_db_test/' .env.testing
          sed -i 's/^DB_USERNAME=.*/DB_USERNAME=postgres/' .env.testing
          sed -i 's/^DB_PASSWORD=.*/DB_PASSWORD=postgres/' .env.testing
          sed -i 's/^DB_HOST=.*/DB_HOST=127.0.0.1/' .env.testing
          sed -i 's/^DB_PORT=.*/DB_PORT=5432/' .env.testing
          cp .env.testing .env

      - name: Install Composer dependencies
        run: |
          composer install --prefer-dist --no-interaction --no-progress --no-scripts
          php artisan package:discover --ansi

      - name: Install NPM dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run build

      - name: Generate application key
        run: php artisan key:generate --env=testing

      - name: Run migrations
        run: php artisan migrate:fresh --seed --env=testing

      - name: Upgrade Chrome Driver
        run: php artisan dusk:chrome-driver --detect

      - name: Start Chrome Driver
        run: ./vendor/laravel/dusk/bin/chromedriver-linux &

      - name: Start Laravel server
        run: php artisan serve --env=testing &

      - name: Wait for server
        run: sleep 5

      - name: Run Dusk Tests
        run: php artisan dusk --env=testing

      - name: Upload Screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: dusk-screenshots-chrome
          path: tests/Browser/screenshots
          retention-days: 7

      - name: Upload Console Logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: dusk-console-logs-chrome
          path: tests/Browser/console
          retention-days: 7

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-chrome
          path: storage/logs
          retention-days: 7

  dusk-firefox:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: lis_db_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.3
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, pdo_pgsql, bcmath, soap, intl, gd, exif, iconv
          coverage: none

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install GeckoDriver
        run: |
          wget https://github.com/mozilla/geckodriver/releases/download/v0.34.0/geckodriver-v0.34.0-linux64.tar.gz
          tar -xvzf geckodriver-v0.34.0-linux64.tar.gz
          chmod +x geckodriver
          sudo mv geckodriver /usr/local/bin/

      - name: Prepare environment
        run: |
          cp .env.testing.example .env.testing
          sed -i 's/^DB_DATABASE=.*/DB_DATABASE=lis_db_test/' .env.testing
          sed -i 's/^DB_USERNAME=.*/DB_USERNAME=postgres/' .env.testing
          sed -i 's/^DB_PASSWORD=.*/DB_PASSWORD=postgres/' .env.testing
          sed -i 's/^DB_HOST=.*/DB_HOST=127.0.0.1/' .env.testing
          sed -i 's/^DB_PORT=.*/DB_PORT=5432/' .env.testing
          cp .env.testing .env

      - name: Install Composer dependencies
        run: |
          composer install --prefer-dist --no-interaction --no-progress --no-scripts
          php artisan package:discover --ansi

      - name: Install NPM dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run build

      - name: Generate application key
        run: php artisan key:generate --env=testing

      - name: Run migrations
        run: php artisan migrate:fresh --seed --env=testing

      - name: Start GeckoDriver
        run: geckodriver &

      - name: Start Laravel server
        run: php artisan serve --env=testing &

      - name: Wait for server
        run: sleep 5

      - name: Run Dusk Tests (Firefox)
        run: TEST_BROWSER=firefox php artisan dusk --env=testing

      - name: Upload Screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: dusk-screenshots-firefox
          path: tests/Browser/screenshots
          retention-days: 7

  notify:
    needs: [dusk-chrome, dusk-firefox]
    runs-on: ubuntu-latest
    if: failure()

    steps:
      - name: Send failure notification
        run: |
          echo "E2E tests failed. Check artifacts for details."
          # Add Slack/Discord webhook notification here if needed
